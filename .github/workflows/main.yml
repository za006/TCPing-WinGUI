name: build-windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        shell: bash
        run: |
          DATE=$(date -u +%Y%m%d)
          VERSION="${DATE}A-${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-winpthreads

      - name: Build resource file
        shell: msys2 {0}
        run: |
          windres TCPing.rc -O coff -o TCPing_res.o

      - name: Build exe
        shell: msys2 {0}
        run: |
          gcc -O2 -Wall -municode -mwindows main.c TCPing_res.o -o TCPing_GUI.exe -lws2_32 -lcomctl32

      - name: Rename output
        shell: bash
        run: |
          cp TCPing_GUI.exe "TCPing_GUI-${{ steps.version.outputs.version }}.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: TCPing_GUI-${{ steps.version.outputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
