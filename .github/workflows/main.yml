name: build-windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-winpthreads

      - name: Build resource file
        shell: msys2 {0}
        run: |
          windres TCPing.rc -O coff -o TCPing_res.o

      - name: Build exe
        shell: msys2 {0}
        run: |
          gcc -O2 -Wall -municode -mwindows main.c TCPing_res.o -o TCPing_GUI.exe -lws2_32 -lcomctl32

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TCPing_GUI
          path: TCPing_GUI.exe
